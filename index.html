<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dulani's Favorite Repos</title>
<style>
  :root { color-scheme: dark; }
  html { background: #000; }
  body {
    margin: 0;
    padding: 12vh 8vw 10vh;
    background: #000;
    color: #e8e8ea;
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 34rem; margin: 0 auto; }

  h1 {
    margin: 0 0 .25em;
    font-size: clamp(1.9rem, 6vw, 2.9rem);
    font-weight: 600;
    letter-spacing: -.02em;
    line-height: 1.15;
  }
  h1::after {
    content: "";
    display: block;
    width: 3rem;
    margin-top: .6rem;
    border-top: 2px solid #3a3a3e;
  }
  .tagline { margin: 0 0 2.5em; color: #8a8a8e; font-size: .95rem; }

  ul { list-style: none; margin: 0; padding: 0; }
  li + li { margin-top: 1.5em; }
  a { color: #e8e8ea; text-decoration: none; border-bottom: 1px solid #3a3a3e; }
  a:hover, a:focus-visible { color: #fff; border-bottom-color: #e8e8ea; }
  .desc { margin: .3em 0 0; color: #8a8a8e; font-size: .9rem; }

  footer { margin-top: 4em; color: #5a5a5e; font-size: .8rem; }
  footer a { color: #5a5a5e; border-bottom-color: #2a2a2e; }
  footer a:hover { color: #8a8a8e; }
</style>
</head>
<body>
<main>

  <h1>Dulani&rsquo;s Favorite Repos</h1>
  <p class="tagline">Small things I built and actually use.</p>

  <ul>
    <!-- To add another: copy one <li> block and change the link, name, and description. -->
    <li>
      <a href="https://dulani.github.io/fullscreenwebcam/">fullscreenwebcam</a>
      <p class="desc">
        Shows a USB webcam fullscreen in the browser. One static file, no
        dependencies. &mdash;
        <a href="https://github.com/Dulani/fullscreenwebcam">source</a>
      </p>
    </li>
  </ul>

  <footer>
    <a href="https://github.com/Dulani">github.com/Dulani</a>
  </footer>

</main>
</body>
</html>
